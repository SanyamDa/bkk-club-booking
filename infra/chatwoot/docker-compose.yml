# One shared Chatwoot CE install for every club (spec §6.3, plan A13).
# Each club gets its own Chatwoot account, created by our server through the platform API.
# Setup, restart and backup: infra/chatwoot/README.md.
#
#   cd infra/chatwoot && cp .env.example .env   # then fill it in
#   docker compose up -d
name: chatwoot

x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:v4.1.0
  env_file: .env
  environment:
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
    POSTGRES_HOST: postgres
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
  volumes:
    - storage:/app/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  rails:
    <<: *chatwoot
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    # Bound to localhost: put the reverse proxy (TLS) in front of it.
    ports:
      - '127.0.0.1:3000:3000'

  sidekiq:
    <<: *chatwoot
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres:
    # Chatwoot 4 needs the pgvector extension.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatwoot}
      POSTGRES_USER: ${POSTGRES_USERNAME:-chatwoot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USERNAME:-chatwoot} -d ${POSTGRES_DATABASE:-chatwoot}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    command: ['sh', '-c', 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

# Named volumes: `docker compose down` (without -v) and host reboots keep all data.
volumes:
  postgres:
  redis:
  storage:
